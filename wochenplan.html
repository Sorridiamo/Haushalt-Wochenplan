<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haushalt-Wochenplan</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Helvetica Neue',Helvetica,sans-serif;background:#f5f5f7;color:#1d1d1f;min-height:100vh}

/* Header */
.header{background:#1d1d1f;color:#fff;padding:16px 20px;position:sticky;top:0;z-index:100}
.header h1{font-size:18px;font-weight:600;text-align:center;margin-bottom:12px}
.week-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:12px}
.week-nav button{background:rgba(255,255,255,.15);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.week-nav button:hover{background:rgba(255,255,255,.25)}
.week-info{text-align:center;min-width:280px}
.week-info .kw{font-size:15px;font-weight:600}
.week-info .dates{font-size:12px;opacity:.7;margin-top:2px}
.week-badge{display:inline-block;background:#5856D6;color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:8px}
.week-badge.b{background:#FF9500}

/* Filter */
.filter-bar{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.filter-btn{border:none;padding:8px 18px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;background:rgba(255,255,255,.12);color:#fff;transition:all .2s}
.filter-btn.active{background:#fff;color:#1d1d1f}
.filter-btn[data-person="Marco"].active{background:#5856D6;color:#fff}
.filter-btn[data-person="Noela"].active{background:#FF2D55;color:#fff}
.filter-btn[data-person="Simeo"].active{background:#34C759;color:#fff}

/* Progress */
.progress-bar-wrap{display:flex;justify-content:center;gap:20px;margin-top:10px;font-size:12px;flex-wrap:wrap}
.progress-item{display:flex;align-items:center;gap:6px}
.progress-dot{width:8px;height:8px;border-radius:50%}
.progress-dot.marco{background:#5856D6}
.progress-dot.noela{background:#FF2D55}
.progress-dot.simeo{background:#34C759}

/* Time summary row */
.time-summary{display:flex;justify-content:center;gap:20px;margin-top:6px;font-size:11px;opacity:.8;flex-wrap:wrap}
.time-summary .ts-item{display:flex;align-items:center;gap:4px}

/* Days grid */
.days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:12px;max-width:1400px;margin:0 auto}
@media(max-width:1100px){.days-grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:700px){.days-grid{grid-template-columns:1fr;max-width:500px}}

/* Day column */
.day-col{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.day-header{padding:10px 12px;font-weight:600;font-size:13px;border-bottom:1px solid #e5e5ea;display:flex;justify-content:space-between;align-items:center}
.day-header .day-name{color:#1d1d1f}
.day-header .day-date{color:#86868b;font-weight:400;font-size:12px}
.day-header.today{background:#007AFF;color:#fff}
.day-header.today .day-date{color:rgba(255,255,255,.7)}
.day-progress{height:3px;background:#e5e5ea}
.day-progress-fill{height:100%;background:#34C759;transition:width .3s}

/* Day time summary */
.day-time-bar{padding:6px 12px;background:#f9f9fb;display:flex;justify-content:space-between;font-size:11px;color:#86868b;border-bottom:1px solid #f0f0f0}
.day-time-bar .remaining{font-weight:600;color:#FF3B30}
.day-time-bar .remaining.alldone{color:#34C759}

/* Category header */
.cat-header{padding:6px 12px 3px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#86868b;border-top:1px solid #f0f0f0;margin-top:2px}
.cat-header:first-child{border-top:none;margin-top:0}

/* Task item */
.task-item{display:flex;align-items:flex-start;padding:5px 12px;gap:8px;border-bottom:1px solid #f5f5f7}
.task-item:last-child{border-bottom:none}
.task-item.done{opacity:.5}
.task-item.done .task-name{text-decoration:line-through}
.task-check{width:18px;height:18px;border-radius:4px;border:2px solid #c7c7cc;cursor:pointer;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.task-check.checked{border-color:#34C759;background:#34C759}
.task-check.checked::after{content:'✓';color:#fff;font-size:12px;font-weight:700}
.task-name{font-size:12px;line-height:1.3;flex:1}
.task-meta{display:flex;align-items:center;gap:4px}
.task-time{font-size:10px;color:#86868b;font-style:italic}
.task-mins{font-size:10px;color:#007AFF;font-weight:600;white-space:nowrap}
.person-badge{font-size:9px;font-weight:700;padding:1px 6px;border-radius:8px;flex-shrink:0;color:#fff;margin-top:1px}
.person-badge.marco{background:#5856D6}
.person-badge.noela{background:#FF2D55}
.person-badge.simeo{background:#34C759}

/* Empty day */
.day-empty{padding:20px;text-align:center;color:#c7c7cc;font-size:12px}

/* Footer */
.footer{text-align:center;padding:20px;font-size:11px;color:#86868b}

@media print{
  .header{position:static;background:#fff;color:#1d1d1f}
  .week-nav button,.filter-bar,.progress-bar-wrap,.time-summary{display:none}
  .week-badge{border:1px solid #1d1d1f}
  .days-grid{grid-template-columns:repeat(7,1fr)}
  .day-col{box-shadow:none;border:1px solid #ddd}
}
</style>
</head>
<body>

<div class="header">
  <h1>Haushalt-Wochenplan</h1>
  <div class="week-nav">
    <button id="prevWeek">◂</button>
    <div class="week-info">

      <div class="dates" id="dateLabel"></div>
    </div>
    <button id="nextWeek">▸</button>
  </div>
  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active" data-person="Alle">Alle</button>
    <button class="filter-btn" data-person="Marco">Marco</button>
    <button class="filter-btn" data-person="Noela">Noela</button>
    <button class="filter-btn" data-person="Simeo">Simeo</button>
  </div>
  <div class="progress-bar-wrap" id="progressWrap"></div>
  <div class="time-summary" id="timeSummary"></div>
</div>

<div class="days-grid" id="daysGrid"></div>
<div class="footer">Wochenplan · Rotation A/B ab KW 39 (21. Sep 2026) · Daten werden lokal gespeichert</div>

<script>
// ═══════════════════════════════════════════════════════

  {id:'schuhe',      name:'Schuhe aufräumen (Eingang)',       cat:'Ordnung', days:'daily', assign:'ordnung', mins:3},

  {id:'gruen-raus', name:'Grünabfall rausstellen',       cat:'Entsorgung', days:[1], assign:'gruen', time:'Abend', mins:3},

  {id:'kw-ofen',   name:'Backofen reinigen',               cat:'Küche', days:[6], assign:'kuecheW', mins:5},

  {id:'kw-kaffee', name:'Kaffeemaschine putzen',           cat:'Küche', days:[6], assign:'kuecheW', mins:5},
  {id:'kw-schubl', name:'Schubladen reinigen (Handgriffe)',cat:'Küche', days:[6], assign:'kuecheW', mins:10},
  {id:'kw-boden',  name:'Küchenboden wischen',             cat:'Küche', days:[6], assign:'kuecheW', mins:10},
  {id:'kw-tuech',  name:'Spültücher + Handtücher ersetzen',cat:'Küche', days:[6], assign:'kuecheW', mins:3},

  // Putzen andere Räume (nur Wochen ohne Putzfrau = Woche A)
  {id:'p-wz',   name:'Wohnzimmer putzen',                 cat:'Putzen', days:[6], assign:'putzWZ', mins:10, biweekly:'A'},
  {id:'p-buero',name:'Büro putzen',                        cat:'Putzen', days:[6], assign:'putzWZ', mins:5, biweekly:'A'},

  {id:'p-eg',   name:'Eingangsbereich putzen',             cat:'Putzen', days:[6], assign:'putzGang', mins:5, biweekly:'A'},

  {id:'pfl-orch',name:'Orchidee 1h baden',                 cat:'Pflanzen', days:[6], assign:'pflanzen', mins:5},

// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════

const REF_DATE = new Date(2026, 8, 21); // Sept 21 2026
const REF_KW = 39;

let currentWeekOffset = 0;
let currentPerson = 'Alle';

// ═══════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════

function getWeekMonday(offset) {
  const d = new Date(REF_DATE);
  d.setDate(d.getDate() + offset * 7);
  return d;
}

function getKW(offset) { return REF_KW + offset; }

function getWeekType(offset) {
  const kw = getKW(offset);
  return kw % 2 === 1 ? 'A' : 'B';
}

function formatDate(d) {
  return d.getDate() + '.' + (d.getMonth()+1) + '.';
}

function formatDateFull(d) {
  const months = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  return d.getDate() + '. ' + months[d.getMonth()] + ' ' + d.getFullYear();
}

function isToday(d) {
  const t = new Date();
  return d.getDate()===t.getDate() && d.getMonth()===t.getMonth() && d.getFullYear()===t.getFullYear();
}

function resolvePersons(assign, weekType) {
  if (assign === 'self') return PERSONS.slice();
  if (ROT[assign]) return [ROT[assign][weekType]];
  return [assign];
}

function storageKey(weekOffset, taskId, person, dayNum) {
  return `hw-${getKW(weekOffset)}-${taskId}-${person}-${dayNum}`;
}

function isChecked(weekOffset, taskId, person, dayNum) {
  return localStorage.getItem(storageKey(weekOffset, taskId, person, dayNum)) === '1';
}

function setChecked(weekOffset, taskId, person, dayNum, val) {
  const k = storageKey(weekOffset, taskId, person, dayNum);
  if (val) localStorage.setItem(k, '1');
  else localStorage.removeItem(k);
}

function fmtMins(m) {
  if (m < 60) return m + ' Min';
  const h = Math.floor(m / 60);
  const r = m % 60;
  return r ? `${h} Std ${r} Min` : `${h} Std`;
}

// ═══════════════════════════════════════════════════════
// TASK RESOLUTION
// ═══════════════════════════════════════════════════════

function getTasksForDay(weekOffset, dayNum, personFilter) {
  const weekType = getWeekType(weekOffset);
  const result = [];

  for (const t of TASKS) {
    const dayMatch = t.days === 'daily' || (Array.isArray(t.days) && t.days.includes(dayNum));
    if (!dayMatch) continue;
    if (t.biweekly && t.biweekly !== weekType) continue;

    const persons = resolvePersons(t.assign, weekType);

    for (const p of persons) {
      if (personFilter === 'Alle' || personFilter === p) {
        result.push({
          id: t.id,
          name: t.name,
          cat: t.cat,
          person: p,
          time: t.time || '',
          mins: t.mins || 0,
          checked: isChecked(weekOffset, t.id, p, dayNum),
        });
      }
    }
  }

  result.sort((a, b) => {
    const ca = CAT_ORDER.indexOf(a.cat), cb = CAT_ORDER.indexOf(b.cat);
    if (ca !== cb) return ca - cb;
    return PERSONS.indexOf(a.person) - PERSONS.indexOf(b.person);
  });

  return result;
}

// ═══════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════

function render() {
  const weekType = getWeekType(currentWeekOffset);
  const kw = getKW(currentWeekOffset);
  const monday = getWeekMonday(currentWeekOffset);
  const sunday = new Date(monday); sunday.setDate(sunday.getDate() + 6);

  // Header
  document.getElementById('kwLabel').innerHTML =
    `KW ${kw} <span class="week-badge ${weekType==='B'?'b':''}">${weekType==='A'?'Woche A':'Woche B'}</span>`;
  document.getElementById('dateLabel').textContent =
    `${formatDateFull(monday)} – ${formatDateFull(sunday)}`;

  // Progress + Time per person for the week
  const progWrap = document.getElementById('progressWrap');
  const timeSummary = document.getElementById('timeSummary');
  let progHTML = '';
  let timeHTML = '';

  for (const p of PERSONS) {
    let total = 0, done = 0, totalMins = 0, remainMins = 0;
    for (let d = 1; d <= 7; d++) {
      const tasks = getTasksForDay(currentWeekOffset, d, p);
      total += tasks.length;
      done += tasks.filter(t => t.checked).length;
      for (const t of tasks) {
        totalMins += t.mins;
        if (!t.checked) remainMins += t.mins;
      }
    }
    const cls = p.toLowerCase();
    progHTML += `<div class="progress-item"><span class="progress-dot ${cls}"></span>${p}: ${done}/${total}</div>`;
    timeHTML += `<div class="ts-item"><span class="progress-dot ${cls}"></span>${fmtMins(totalMins)} total · <strong>${fmtMins(remainMins)}</strong> offen</div>`;
  }
  progWrap.innerHTML = progHTML;
  timeSummary.innerHTML = timeHTML;

  // Days
  const grid = document.getElementById('daysGrid');
  grid.innerHTML = '';

  for (let d = 1; d <= 7; d++) {
    const dayDate = new Date(monday);
    dayDate.setDate(dayDate.getDate() + d - 1);
    const tasks = getTasksForDay(currentWeekOffset, d, currentPerson);
    const done = tasks.filter(t => t.checked).length;
    const pct = tasks.length ? Math.round(done / tasks.length * 100) : 0;

    // Time calculations for this day
    const totalMins = tasks.reduce((s, t) => s + t.mins, 0);
    const remainMins = tasks.filter(t => !t.checked).reduce((s, t) => s + t.mins, 0);

    const col = document.createElement('div');
    col.className = 'day-col';

    const today = isToday(dayDate);

    col.innerHTML = `
      <div class="day-header ${today?'today':''}">
        <span class="day-name">${DAY_NAMES[d-1]}</span>
        <span class="day-date">${formatDate(dayDate)}</span>
      </div>
      <div class="day-progress"><div class="day-progress-fill" style="width:${pct}%"></div></div>
      <div class="day-time-bar">
        <span>${fmtMins(totalMins)}</span>
        <span class="remaining ${remainMins===0&&tasks.length?'alldone':''}">${remainMins===0&&tasks.length?'✓ Fertig':fmtMins(remainMins)+' offen'}</span>
      </div>
    `;

    if (tasks.length === 0) {
      col.innerHTML += '<div class="day-empty">Keine Aufgaben</div>';
    } else {
      let lastCat = '';
      for (const t of tasks) {
        if (t.cat !== lastCat) {
          lastCat = t.cat;
          const ch = document.createElement('div');
          ch.className = 'cat-header';
          ch.textContent = t.cat;
          col.appendChild(ch);
        }

        const item = document.createElement('div');
        item.className = 'task-item' + (t.checked ? ' done' : '');

        const showPerson = currentPerson === 'Alle';
        const timeStr = t.time ? `<span class="task-time">${t.time}</span>` : '';
        const minsStr = t.mins ? `<span class="task-mins">${t.mins}′</span>` : '';
        const badgeStr = showPerson
          ? `<span class="person-badge ${t.person.toLowerCase()}">${t.person}</span>`
          : '';

        item.innerHTML = `
          <div class="task-check ${t.checked?'checked':''}"
               data-tid="${t.id}" data-person="${t.person}" data-day="${d}"></div>
          <div style="flex:1">
            <div class="task-name">${t.name}</div>
            <div class="task-meta">${timeStr}${timeStr&&minsStr?' · ':''}${minsStr}</div>
          </div>
          ${badgeStr}
        `;
        col.appendChild(item);
      }
    }

    grid.appendChild(col);
  }

  // Bind checkboxes
  document.querySelectorAll('.task-check').forEach(el => {
    el.addEventListener('click', function() {
      const tid = this.dataset.tid;
      const person = this.dataset.person;
      const day = parseInt(this.dataset.day);
      const wasChecked = isChecked(currentWeekOffset, tid, person, day);
      setChecked(currentWeekOffset, tid, person, day, !wasChecked);
      render();
    });
  });
}

// ═══════════════════════════════════════════════════════
// EVENT LISTENERS
// ═══════════════════════════════════════════════════════

document.getElementById('prevWeek').addEventListener('click', () => {
  currentWeekOffset--;
  render();
});

document.getElementById('nextWeek').addEventListener('click', () => {
  currentWeekOffset++;
  render();
});

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    currentPerson = this.dataset.person;
    render();
  });
});

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') { currentWeekOffset--; render(); }
  if (e.key === 'ArrowRight') { currentWeekOffset++; render(); }
});

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════

render();
</script>
</body>
</html>
