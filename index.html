<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wochenplan">
<title>Haushalt-Wochenplan</title>
<style>
:root{
  --marco:#E8C766;      --marco-l:#FBF3DA;   --marco-d:#8A6E14;
  --noela:#E2AEB1;      --noela-l:#F9EBEC;   --noela-d:#8C4F53;
  --simeo:#A6D2A0;      --simeo-l:#E9F4E7;   --simeo-d:#3F6E38;
  --ink:#2C2C2E;        --mute:#8E8E93;      --line:#E8E8ED;
  --bg:#FAFAFA;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:40px}

/* ───── Top bar ───── */
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:14px 16px 12px;position:sticky;top:0;z-index:50}
.filter-bar{display:flex;gap:8px;justify-content:center;max-width:620px;margin:0 auto}
.fbtn{flex:1;border:1.5px solid var(--line);background:#fff;padding:10px 4px;border-radius:12px;font-size:14px;font-weight:600;color:var(--mute);cursor:pointer;transition:all .18s}
.fbtn:hover{border-color:#d5d5da}
.fbtn.active{color:#fff;border-color:transparent}
.fbtn[data-p="Alle"].active{background:var(--ink)}
.fbtn[data-p="Marco"].active{background:var(--marco);color:var(--marco-d)}
.fbtn[data-p="Noela"].active{background:var(--noela);color:var(--noela-d)}
.fbtn[data-p="Simeo"].active{background:var(--simeo);color:var(--simeo-d)}

/* ───── Day navigation ───── */
.daynav{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:14px}
.navbtn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:19px;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .18s}
.navbtn:hover{background:#f2f2f5}
.dayinfo{text-align:center;min-width:220px}
.dayinfo .dname{font-size:22px;font-weight:700;letter-spacing:-.4px}
.dayinfo .ddate{font-size:13px;color:var(--mute);margin-top:2px}
.kwbadge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;background:#F0F0F4;color:var(--mute);margin-left:6px;vertical-align:2px}
.kwbadge.putzfrau{background:#E6EFFB;color:#3A6FB0}

.toprow{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:10px}
.todaybtn{border:none;background:none;font-size:12px;color:#3A6FB0;cursor:pointer;font-weight:600}
.newbtn{border:1.5px solid var(--ink);background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:8px 16px;border-radius:11px;cursor:pointer;transition:opacity .15s}
.newbtn:hover{opacity:.85}

/* ───── Neue-Aufgabe-Formular ───── */
.newform{max-width:900px;margin:14px auto 0;padding:0 14px}
.newcard{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.newcard h3{font-size:14px;font-weight:800;margin-bottom:14px;letter-spacing:.2px}
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:600px){.fgrid{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:5px}
.fld.full{grid-column:1/-1}
.fld label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--mute)}
.fld input,.fld select{border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;font-family:inherit;color:var(--ink);background:#fff;-webkit-appearance:none;appearance:none}
.fld select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%238E8E93' d='M7 10l5 5 5-5z'/></svg>");background-repeat:no-repeat;background-position:right 8px center;background-size:18px;padding-right:30px}
.fld input:focus,.fld select:focus{outline:none;border-color:#9FA0A6}
.formacts{display:flex;gap:10px;margin-top:16px}
.formacts button{flex:1;border:none;border-radius:11px;padding:11px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.formacts .save{background:#34C759;color:#fff}
.formacts .cancel2{background:#F0F0F4;color:var(--mute)}
.fhint{font-size:11px;color:var(--mute);margin-top:10px;line-height:1.4}

/* ───── Panels ───── */
.panels{max-width:900px;margin:18px auto 0;padding:0 14px;display:flex;flex-direction:column;gap:16px}
.panel{display:flex;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.pbar{width:96px;flex-shrink:0;padding:18px 12px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center}
.panel[data-p="Marco"] .pbar{background:var(--marco)}
.panel[data-p="Noela"] .pbar{background:var(--noela)}
.panel[data-p="Simeo"] .pbar{background:var(--simeo)}
.panel[data-p="Marco"] .pname{color:var(--marco-d)}
.panel[data-p="Noela"] .pname{color:var(--noela-d)}
.panel[data-p="Simeo"] .pname{color:var(--simeo-d)}
.pname{font-size:17px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;line-height:1.1}
.pstat{font-size:11px;font-weight:700;color:rgba(0,0,0,.42);margin-top:14px;line-height:1.45}
.pring{width:44px;height:44px;margin-top:14px;position:relative}
.pring svg{transform:rotate(-90deg)}
.pring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:rgba(0,0,0,.5)}

.ptasks{flex:1;padding:12px 0}
.slabel{font-size:10px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--mute);padding:4px 16px 6px}
.sdivider{height:1px;background:var(--line);margin:8px 16px 2px}
.catlabel{font-size:12px;font-weight:800;letter-spacing:.3px;color:#3A3A3C;padding:10px 16px 3px}

/* ───── Task row ───── */
.trow{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid #F7F7F9;position:relative}
.trow:last-child{border-bottom:none}
.chk{width:21px;height:21px;border-radius:6px;border:2px solid #CFCFD4;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.chk::after{content:'✓';color:#fff;font-size:13px;font-weight:800;opacity:0;transition:opacity .15s}
.trow.done .chk{background:#34C759;border-color:#34C759}
.trow.done .chk::after{opacity:1}
.tname{flex:1;font-size:14px;line-height:1.3}
.trow.done .tname{text-decoration:line-through;color:var(--mute)}
.ttime{font-size:10px;color:var(--mute);font-style:italic;display:block;margin-top:1px}
.tmins{font-size:12px;font-weight:700;color:var(--mute);white-space:nowrap;min-width:52px;text-align:right}
.trow.faded{opacity:.42}
.trow.faded .tname{font-style:italic}
.newpill{display:inline-block;font-size:8px;font-weight:800;background:#E6EFFB;color:#3A6FB0;padding:2px 5px;border-radius:5px;margin-left:6px;vertical-align:1px;letter-spacing:.3px}

/* Delegation button */
.dbtn{width:30px;height:30px;border-radius:9px;border:none;background:#F4F4F7;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
.dbtn:hover{background:#E8E8EE}
.dbtn svg{width:16px;height:16px;fill:var(--mute)}
.dbtn.active{background:var(--ink)}
.dbtn.active svg{fill:#fff}
.delbtn{width:26px;height:26px;border-radius:8px;border:none;background:#FDECEC;color:#B62F2F;font-size:13px;font-weight:800;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}

/* Delegation tag */
.dtag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:7px;white-space:nowrap;background:#F0F0F4;color:var(--mute)}
.dtag.out{background:#FFF4E0;color:#A06A00}
.dtag.in{background:#E9F0FB;color:#3A6FB0}

/* Accept / decline */
.acts{display:flex;gap:6px;flex-shrink:0}
.abtn{width:30px;height:30px;border-radius:9px;border:none;cursor:pointer;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.abtn:active{transform:scale(.9)}
.abtn.yes{background:#DFF5E3;color:#1E7A35}
.abtn.no{background:#FDE7E7;color:#B62F2F}

/* Picker */
.picker{display:flex;gap:6px;padding:8px 16px 12px;flex-wrap:wrap;background:#FAFAFC;border-bottom:1px solid #F7F7F9}
.pick{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer}
.pick[data-t="Marco"]{border-color:var(--marco);color:var(--marco-d);background:var(--marco-l)}
.pick[data-t="Noela"]{border-color:var(--noela);color:var(--noela-d);background:var(--noela-l)}
.pick[data-t="Simeo"]{border-color:var(--simeo);color:var(--simeo-d);background:var(--simeo-l)}
.pick.cancel{color:var(--mute)}

.empty{padding:26px 16px;text-align:center;color:#C7C7CC;font-size:13px}

/* Sync */
.sync{text-align:center;font-size:10px;color:var(--mute);padding:22px 0 8px}
.sdot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:middle;background:#C7C7CC}
.sdot.on{background:#34C759}
.sdot.off{background:#FF3B30}

@media(max-width:560px){
  .pbar{width:78px;padding:14px 8px}
  .pname{font-size:15px}
  .tname{font-size:13px}
  .dayinfo{min-width:150px}
  .dayinfo .dname{font-size:19px}
  .panels{padding:0 10px}
  .catlabel{font-size:11px}
}
@media print{
  .topbar,.dbtn,.acts,.picker,.sync,.todaybtn,.newbtn,.newform,.delbtn{display:none}
  .panel{box-shadow:none;border:1px solid #ddd}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="filter-bar" id="filterBar">
    <button class="fbtn active" data-p="Alle">Alle</button>
    <button class="fbtn" data-p="Marco">Marco</button>
    <button class="fbtn" data-p="Simeo">Simeo</button>
    <button class="fbtn" data-p="Noela">Noela</button>
  </div>
  <div class="daynav">
    <button class="navbtn" id="prevDay">‹</button>
    <div class="dayinfo">
      <div class="dname" id="dName"></div>
      <div class="ddate" id="dDate"></div>
    </div>
    <button class="navbtn" id="nextDay">›</button>
  </div>
  <div class="toprow">
    <button class="todaybtn" id="todayBtn">Heute</button>
    <button class="newbtn" id="newBtn">+ Neue Aufgabe</button>
  </div>
</div>

<div class="newform" id="newForm" style="display:none">
  <div class="newcard">
    <h3>Neue Aufgabe erfassen</h3>
    <div class="fgrid">
      <div class="fld full">
        <label for="fName">Name der Aufgabe</label>
        <input type="text" id="fName" placeholder="z.B. Velo putzen">
      </div>
      <div class="fld">
        <label for="fFreq">Wie oft</label>
        <select id="fFreq">
          <option value="daily">Jeden Tag</option>
          <option value="weekly" selected>Wöchentlich</option>
          <option value="once">Einmalig</option>
        </select>
      </div>
      <div class="fld" id="wrapDay">
        <label for="fDay">Wochentag</label>
        <select id="fDay">
          <option value="1">Montag</option>
          <option value="2">Dienstag</option>
          <option value="3">Mittwoch</option>
          <option value="4">Donnerstag</option>
          <option value="5">Freitag</option>
          <option value="6">Samstag</option>
          <option value="7">Sonntag</option>
        </select>
      </div>
      <div class="fld" id="wrapDate" style="display:none">
        <label for="fDate">Datum</label>
        <input type="date" id="fDate">
      </div>
      <div class="fld">
        <label for="fWho">Wer führt sie aus</label>
        <select id="fWho">
          <option value="Marco">Marco</option>
          <option value="Simeo">Simeo</option>
          <option value="Noela">Noela</option>
          <option value="self">Alle drei</option>
        </select>
      </div>
      <div class="fld">
        <label for="fCat">Kategorie</label>
        <select id="fCat"></select>
      </div>
      <div class="fld">
        <label for="fTime">Tageszeit (optional)</label>
        <select id="fTime">
          <option value="">—</option>
          <option value="Morgen">Morgen</option>
          <option value="Vormittag">Vormittag</option>
          <option value="Mittag">Mittag</option>
          <option value="Nachmittag">Nachmittag</option>
          <option value="Abend">Abend</option>
        </select>
      </div>
      <div class="fld">
        <label for="fMins">Dauer in Minuten</label>
        <input type="number" id="fMins" value="10" min="1" max="600">
      </div>
    </div>
    <div class="formacts">
      <button class="cancel2" id="fCancel">Abbrechen</button>
      <button class="save" id="fSave">Aufgabe hinzufügen</button>
    </div>
    <div class="fhint">Neue Aufgaben werden für alle Geräte gespeichert. Sie erscheinen mit einem blauen „Neu"-Zeichen und können über das rote ✕ wieder entfernt werden.</div>
  </div>
</div>

<div class="panels" id="panels"></div>
<div class="sync" id="sync"></div>

// ══════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════
const REF_DATE = new Date(2026, 8, 21); // Montag, 21. Sep 2026 = KW 39
const REF_KW = 39;

let dayOffset = 0;            // Tage seit REF_DATE
let filterPerson = 'Alle';
let checks = {};              // { key: true }
let delegs = {};              // { key: {from,to,status} }
let customs = {};             // { id: {name,cat,freq,day,date,assign,mins,time} }
let openPicker = null;
let checkRef = null, delegRef = null;

// ══════════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════════
function dateFor(off){ const d = new Date(REF_DATE); d.setDate(d.getDate()+off); return d; }
function isoOf(d){
  const m = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0');
  return d.getFullYear()+'-'+m+'-'+dd;
}
function weekOffsetOf(off){ return Math.floor(off/7); }
function dayNumOf(off){ return ((off%7)+7)%7 + 1; }          // 1=Mo … 7=So
function kwOf(off){ return REF_KW + weekOffsetOf(off); }
// Putzfrau-Plan: 'A' = kommt NICHT (wir putzen alles), 'B' = kommt (wir putzen nicht)
// Grundregel ab 15. Oktober 2026 (KW 42): gerade KW = Putzfrau, ungerade KW = ohne Putzfrau
// Ausnahmen für die laufenden Wochen:
const KW_OVERRIDE = {
  39: 'A',   // diese Woche: Putzfrau war nur kurz da → Bäder entfallen (siehe KW_NO_BATH)
  40: 'A',   // Putzfrau kommt nicht → alles putzen
  41: 'A',   // Putzfrau kommt nicht → alles putzen
};
const KW_NO_BATH = [39];   // Bäder/WC entfallen, Rest bleibt

function weekTypeOf(off){
  const kw = kwOf(off);
  if (KW_OVERRIDE[kw]) return KW_OVERRIDE[kw];
  return kw%2===1 ? 'A' : 'B';
}
function bathSkipped(off){ return KW_NO_BATH.indexOf(kwOf(off)) !== -1; }

function todayOffset(){
  const t = new Date(); t.setHours(0,0,0,0);
  const r = new Date(REF_DATE); r.setHours(0,0,0,0);
  return Math.round((t-r)/86400000);
}
function isToday(off){ return off === todayOffset(); }

function fmtMins(m){
  if (m < 60) return m + ' Min';
  const h = Math.floor(m/60), r = m%60;
  return r ? h+' Std '+r+' Min' : h+' Std';
}
function resolvePersons(assign, wt){
  if (assign === 'self') return PERSONS.slice();
  if (ROT[assign]) return [ROT[assign][wt]];
  return [assign];
}
function keyOf(taskId, owner, dayNum){ return taskId+'_'+owner+'_'+dayNum; }

// ══════════════════════════════════════════════════════════
// FIREBASE LISTENERS
// ══════════════════════════════════════════════════════════
let boundKW = null;
function bindWeek(){
  const kw = kwOf(dayOffset);
  if (kw === boundKW) { render(); return; }
  if (checkRef) checkRef.off();
  if (delegRef) delegRef.off();
  boundKW = kw;
  checks = {}; delegs = {};

  checkRef = db.ref('checks/kw'+kw);
  checkRef.on('value', s => { checks = s.val() || {}; render(); });

  delegRef = db.ref('delegations/kw'+kw);
  delegRef.on('value', s => { delegs = s.val() || {}; render(); });
}

// Eigene Aufgaben: global, nicht pro Woche
db.ref('customTasks').on('value', s => { customs = s.val() || {}; render(); });

function setCheck(key, val){
  const r = db.ref('checks/kw'+kwOf(dayOffset)+'/'+key);
  if (val) { r.set(true); checks[key] = true; } else { r.remove(); delete checks[key]; }
}
function offerTask(key, from, to){
  const rec = {from:from, to:to, status:'pending'};
  db.ref('delegations/kw'+kwOf(dayOffset)+'/'+key).set(rec);
  delegs[key] = rec;
}
function acceptTask(key){
  db.ref('delegations/kw'+kwOf(dayOffset)+'/'+key+'/status').set('accepted');
  if (delegs[key]) delegs[key].status = 'accepted';
}
function clearDeleg(key){
  db.ref('delegations/kw'+kwOf(dayOffset)+'/'+key).remove();
  delete delegs[key];
}
function addCustom(rec){ db.ref('customTasks').push(rec); }
function removeCustom(id){ db.ref('customTasks/'+id).remove(); }

// ══════════════════════════════════════════════════════════
// AUFGABEN-LISTE (fix + eigene)
// ══════════════════════════════════════════════════════════
function allTasksFor(off){
  const dn = dayNumOf(off), iso = isoOf(dateFor(off));
  const list = TASKS.slice();

  for (const id in customs){
    const c = customs[id];
    if (!c || !c.name) continue;
    let match = false, weekly = false;
    if (c.freq === 'daily')       { match = true; }
    else if (c.freq === 'weekly') { match = Number(c.day) === dn; weekly = true; }
    else if (c.freq === 'once')   { match = c.date === iso; }
    if (!match) continue;

    list.push({
      id: 'c_'+id, customId: id,
      name: c.name, cat: c.cat || 'Sonstiges',
      days: 'daily',                       // Tagesprüfung ist hier schon erledigt
      assign: c.assign || 'Marco',
      mins: Number(c.mins) || 0,
      time: c.time || '',
      weekly: weekly,
      once: c.freq === 'once',
    });
  }
  return list;
}

// ══════════════════════════════════════════════════════════
// INSTANZEN FÜR DEN TAG
// ══════════════════════════════════════════════════════════
function instancesForDay(off){
  const wt = weekTypeOf(off), dn = dayNumOf(off), out = [];

  for (const t of allTasksFor(off)){
    const match = t.days === 'daily' || (Array.isArray(t.days) && t.days.includes(dn));
    if (!match) continue;
    if (t.biweekly && t.biweekly !== wt) continue;
    if (t.bath && bathSkipped(off)) continue;

    for (const owner of resolvePersons(t.assign, wt)){
      const key = keyOf(t.id, owner, dn);
      const d = delegs[key];
      out.push({
        key, id:t.id, customId:t.customId||null, once:!!t.once,
        name:t.name, cat:t.cat, mins:t.mins||0, time:t.time||'',
        weekly: !!t.weekly,
        owner,
        holder: (d && d.status === 'accepted') ? d.to : owner,
        pending: (d && d.status === 'pending') ? d : null,
        fromTransfer: (d && d.status === 'accepted') ? d.from : null,
        done: checks[key] === true,
      });
    }
  }

  out.sort((a,b) => {
    if (a.weekly !== b.weekly) return a.weekly ? 1 : -1;
    const ca = CAT_ORDER.indexOf(a.cat), cb = CAT_ORDER.indexOf(b.cat);
    if (ca !== cb) return ca - cb;
    return 0;
  });
  return out;
}

function viewFor(person, all){
  const own = all.filter(i => i.holder === person);
  const incoming = all.filter(i => i.pending && i.pending.to === person);
  return own.concat(incoming.filter(i => !own.includes(i)));
}

// ══════════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════════
const ICON_HAND = '<svg viewBox="0 0 24 24"><path d="M9 11.5a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm0 1.5c-3 0-5.5 1.6-5.5 3.6V19h11v-2.4C14.5 14.6 12 13 9 13Zm8.3-6.8-1.1 1.1 1.7 1.7h-4.4v1.5h4.4l-1.7 1.7 1.1 1.1L21 9.7l-3.7-3.7Z"/></svg>';

function render(){
  const off = dayOffset, dn = dayNumOf(off), d = dateFor(off);
  const wt = weekTypeOf(off), kw = kwOf(off);

  document.getElementById('dName').textContent = DAY_NAMES[dn-1];
  const noBath = bathSkipped(off);
  const badgeTxt = noBath ? 'Putzfrau kurz da · ohne Bäder'
                          : (wt==='B' ? 'Putzfrau' : 'ohne Putzfrau');
  document.getElementById('dDate').innerHTML =
    d.getDate()+'. '+MONTHS[d.getMonth()]+' '+d.getFullYear()+
    '<span class="kwbadge'+(wt==='B'||noBath?' putzfrau':'')+'">KW '+kw+' · '+badgeTxt+'</span>';
  document.getElementById('todayBtn').style.visibility = isToday(off) ? 'hidden' : 'visible';

  const all = instancesForDay(off);
  const shown = filterPerson === 'Alle' ? PERSONS : [filterPerson];
  const wrap = document.getElementById('panels');
  wrap.innerHTML = '';

  for (const p of shown){
    const list = viewFor(p, all);
    const mine = list.filter(i => i.holder === p);
    const openTotal = mine.filter(i => !i.done).reduce((s,i) => s+i.mins, 0);
    const total = mine.reduce((s,i) => s+i.mins, 0);
    const cnt = mine.length;
    const doneCnt = mine.filter(i => i.done).length;
    const pct = cnt ? Math.round(doneCnt/cnt*100) : 0;

    const panel = document.createElement('div');
    panel.className = 'panel';
    panel.dataset.p = p;

    const circ = 2*Math.PI*18;
    panel.innerHTML =
      '<div class="pbar">'+
        '<div><div class="pname">'+p+'</div>'+
        '<div class="pstat">'+doneCnt+' / '+cnt+' erledigt<br>'+fmtMins(openTotal)+' offen<br><span style="opacity:.6">'+fmtMins(total)+' total</span></div></div>'+
        '<div class="pring"><svg width="44" height="44">'+
          '<circle cx="22" cy="22" r="18" fill="none" stroke="rgba(0,0,0,.13)" stroke-width="4"/>'+
          '<circle cx="22" cy="22" r="18" fill="none" stroke="rgba(0,0,0,.42)" stroke-width="4" stroke-linecap="round" '+
          'stroke-dasharray="'+circ+'" stroke-dashoffset="'+(circ*(1-pct/100))+'"/>'+
        '</svg><div class="pct">'+pct+'%</div></div>'+
      '</div>';

    const tw = document.createElement('div');
    tw.className = 'ptasks';

    if (!list.length){
      tw.innerHTML = '<div class="empty">Keine Aufgaben heute</div>';
    } else {
      let sectionShown = {daily:false, weekly:false};
      let prevWeekly = null;
      let prevCat = null;

      for (const i of list){
        if (!sectionShown[i.weekly?'weekly':'daily']){
          sectionShown[i.weekly?'weekly':'daily'] = true;
          if (i.weekly && prevWeekly !== null){
            const div = document.createElement('div'); div.className = 'sdivider'; tw.appendChild(div);
          }
          const lab = document.createElement('div');
          lab.className = 'slabel';
          lab.textContent = i.weekly ? 'Wochenaufgaben' : 'Tagesaufgaben';
          tw.appendChild(lab);
          prevCat = null;
        }
        prevWeekly = i.weekly;

        if (i.cat !== prevCat){
          prevCat = i.cat;
          const catLab = document.createElement('div');
          catLab.className = 'catlabel';
          catLab.textContent = i.cat;
          tw.appendChild(catLab);
        }

        tw.appendChild(taskRow(i, p));
        if (openPicker === i.key + '|' + p) tw.appendChild(pickerRow(i, p));
      }
    }

    panel.appendChild(tw);
    wrap.appendChild(panel);
  }
}

function taskRow(i, viewer){
  const isIncoming = i.pending && i.pending.to === viewer;
  const isOutgoing = i.pending && i.pending.from === viewer;
  const faded = !!i.pending;

  const row = document.createElement('div');
  row.className = 'trow' + (i.done ? ' done' : '') + (faded ? ' faded' : '');

  const timeStr = i.time ? '<span class="ttime">'+i.time+'</span>' : '';
  const fromStr = i.fromTransfer ? '<span class="ttime">übernommen von '+i.fromTransfer+'</span>' : '';
  const newPill = i.customId ? '<span class="newpill">NEU</span>' : '';

  let right = '';
  if (isIncoming){
    right = '<span class="dtag in">von '+i.pending.from+'</span>'+
            '<div class="acts"><button class="abtn yes" data-act="accept" data-key="'+i.key+'">✓</button>'+
            '<button class="abtn no" data-act="decline" data-key="'+i.key+'">✕</button></div>';
  } else if (isOutgoing){
    right = '<span class="dtag out">an '+i.pending.to+'</span>'+
            '<div class="acts"><button class="abtn no" data-act="cancel" data-key="'+i.key+'">✕</button></div>';
  } else {
    right = '<button class="dbtn'+(openPicker===i.key+'|'+viewer?' active':'')+'" data-act="picker" data-key="'+i.key+'" data-viewer="'+viewer+'">'+ICON_HAND+'</button>';
    if (i.customId) right += '<button class="delbtn" data-act="delcustom" data-cid="'+i.customId+'" title="Aufgabe löschen">✕</button>';
  }

  row.innerHTML =
    (isIncoming ? '<div class="chk" style="visibility:hidden"></div>'
                : '<div class="chk" data-act="check" data-key="'+i.key+'"></div>')+
    '<div class="tname">'+i.name+newPill+timeStr+fromStr+'</div>'+
    '<div class="tmins">'+i.mins+' Min</div>'+
    right;
  return row;
}

function pickerRow(i, viewer){
  const row = document.createElement('div');
  row.className = 'picker';
  let html = '<span style="font-size:11px;font-weight:700;color:var(--mute);align-self:center;margin-right:2px">Übergeben an</span>';
  for (const p of PERSONS){
    if (p === viewer) continue;
    html += '<button class="pick" data-t="'+p+'" data-act="offer" data-key="'+i.key+'" data-from="'+viewer+'" data-to="'+p+'">'+p+'</button>';
  }
  html += '<button class="pick cancel" data-act="closepicker">Abbrechen</button>';
  row.innerHTML = html;
  return row;
}

// ══════════════════════════════════════════════════════════
// NEUE AUFGABE — Formular
// ══════════════════════════════════════════════════════════
const catSel = document.getElementById('fCat');
CAT_ORDER.forEach(c => {
  const o = document.createElement('option');
  o.value = c; o.textContent = c;
  if (c === 'Sonstiges') o.selected = true;
  catSel.appendChild(o);
});

const formEl = document.getElementById('newForm');

function toggleForm(show){
  formEl.style.display = show ? 'block' : 'none';
  if (show){
    document.getElementById('fDay').value = String(dayNumOf(dayOffset));
    document.getElementById('fDate').value = isoOf(dateFor(dayOffset));
    document.getElementById('fName').focus();
  }
}
function syncFreqFields(){
  const f = document.getElementById('fFreq').value;
  document.getElementById('wrapDay').style.display  = f === 'weekly' ? 'flex' : 'none';
  document.getElementById('wrapDate').style.display = f === 'once'   ? 'flex' : 'none';
}
document.getElementById('fFreq').addEventListener('change', syncFreqFields);
syncFreqFields();

document.getElementById('newBtn').addEventListener('click', () => {
  toggleForm(formEl.style.display === 'none');
});
document.getElementById('fCancel').addEventListener('click', () => toggleForm(false));

document.getElementById('fSave').addEventListener('click', () => {
  const name = document.getElementById('fName').value.trim();
  if (!name){ document.getElementById('fName').focus(); return; }
  const freq = document.getElementById('fFreq').value;

  const rec = {
    name: name,
    cat:  document.getElementById('fCat').value,
    freq: freq,
    assign: document.getElementById('fWho').value,
    mins: Math.max(1, parseInt(document.getElementById('fMins').value,10) || 10),
    time: document.getElementById('fTime').value,
  };
  if (freq === 'weekly') rec.day  = parseInt(document.getElementById('fDay').value,10);
  if (freq === 'once')   rec.date = document.getElementById('fDate').value;

  addCustom(rec);

  document.getElementById('fName').value = '';
  document.getElementById('fMins').value = '10';
  toggleForm(false);
});

// ══════════════════════════════════════════════════════════
// EVENTS
// ══════════════════════════════════════════════════════════
document.getElementById('panels').addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, key = el.dataset.key;

  if (act === 'check'){
    setCheck(key, !(checks[key] === true));
    openPicker = null; render();
  } else if (act === 'picker'){
    const id = key + '|' + el.dataset.viewer;
    openPicker = (openPicker === id) ? null : id;
    render();
  } else if (act === 'closepicker'){
    openPicker = null; render();
  } else if (act === 'offer'){
    offerTask(key, el.dataset.from, el.dataset.to);
    openPicker = null; render();
  } else if (act === 'accept'){
    acceptTask(key); render();
  } else if (act === 'decline' || act === 'cancel'){
    clearDeleg(key); render();
  } else if (act === 'delcustom'){
    if (confirm('Diese Aufgabe wirklich löschen?')) removeCustom(el.dataset.cid);
  }
});

document.getElementById('prevDay').addEventListener('click', () => { dayOffset--; openPicker=null; bindWeek(); });
document.getElementById('nextDay').addEventListener('click', () => { dayOffset++; openPicker=null; bindWeek(); });
document.getElementById('todayBtn').addEventListener('click', () => { dayOffset = todayOffset(); openPicker=null; bindWeek(); });

document.getElementById('filterBar').addEventListener('click', e => {
  const b = e.target.closest('.fbtn'); if (!b) return;
  document.querySelectorAll('.fbtn').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  filterPerson = b.dataset.p;
  openPicker = null;
  render();
});

document.addEventListener('keydown', e => {
  if (e.target.matches('input,select')) return;
  if (e.key === 'ArrowLeft')  { dayOffset--; openPicker=null; bindWeek(); }
  if (e.key === 'ArrowRight') { dayOffset++; openPicker=null; bindWeek(); }
});

// Wisch-Navigation auf dem iPhone
let tx = 0, ty = 0;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e => {
  if (e.target.closest('.newcard')) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy)*2){
    dayOffset += dx < 0 ? 1 : -1; openPicker = null; bindWeek();
  }
}, {passive:true});

// ══════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════
dayOffset = todayOffset();
bindWeek();
</script>
